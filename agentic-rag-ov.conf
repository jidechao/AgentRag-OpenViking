{
  "server": {
    "host": "127.0.0.1",
    "port": 1933,
    "workers": 1,
    "auth_mode": "dev",
    "with_bot": true
  },
  "vlm": {
    "provider": "deepseek",
    "model": "${DEEPSEEK_MODEL}",
    "api_key": "${DEEPSEEK_API_KEY}",
    "api_base": "https://api.deepseek.com"
  },
  "storage": {
    "workspace": "D:/project/Harness/python-claude-sdk/data"
  },
  "embedding": {
    "dense": {
      "provider": "ollama",
      "model": "qwen3-embedding:0.6b",
      "api_base": "http://127.0.0.1:11434/v1",
      "dimension": 1024,
      "input": "text"
    },
    "max_concurrent": 1,
    "allow_metadata_override": false
  }
}
